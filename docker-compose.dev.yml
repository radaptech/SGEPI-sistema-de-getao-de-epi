services:
  # =================================================================
  # INFRAESTRUTURA: Traefik 
  # =================================================================
  traefik:
    image: traefik:v2.11 # Mude de v3.0 para v2.11
    container_name: traefik_container
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.priority=100"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  # =================================================================
  # 1. INFRAESTRUTURA DE DADOS
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: always  
    ports:
      - "5432:5432"
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sistema-epi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema-epi"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit
    container_name: mailpit_container
    restart: always
    ports:
      - "8025:8025" 
      - "1025:1025" 
    environment:
      MP_MAX_MESSAGES: 500

  # =================================================================
  # 2. API GO
  # =================================================================
  api:
    container_name: api_epi
    restart: on-failure:5
    build:
      context: ./gestao-de-epi--backEnd
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy 
      mailpit:
        condition: service_started
    env_file:
      - ./gestao-de-epi--backEnd/.env
    volumes:
      - ./gestao-de-epi--backEnd:/app
      # cache de compilação do Go: sem ele, toda subida recompila as dependências do zero
      - go_build_cache:/root/.cache/go-build
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - SMTP_HOST=mailpit 
      - SMTP_PORT=1025
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`) || PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.middlewares.cors-header.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.cors-header.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.cors-header.headers.accesscontrolalloworiginlist=http://*.localhost,http://localhost:3000"

  # =================================================================
  # 3. FRONTEND (React)
  # =================================================================
  front:
    container_name: api_front
    restart: always
    build:
      context: ./SGEPI-FRONT-END
      dockerfile: Dockerfile.dev
    env_file:
      - ./SGEPI-FRONT-END/.env
    command: npm start 
    volumes:
      - ./SGEPI-FRONT-END:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true 
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front-router.rule=(Host(`localhost`) || HostRegexp(`{subdomain:[a-zA-Z0-9-]+}.localhost`)) && !PathPrefix(`/api`)"
      - "traefik.http.routers.front-router.entrypoints=web"
      - "traefik.http.routers.front-router.service=front-service"
      - "traefik.http.services.front-service.loadbalancer.server.port=3000"
      - "traefik.http.services.front-service.loadbalancer.passhostheader=true"

volumes:
  postgres_data:
  go_build_cache: