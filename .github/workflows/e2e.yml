name: E2E

# Sobe o ambiente inteiro do docker-compose.dev.yml (Traefik + Postgres + API + front)
# e roda o Playwright contra ele, do jeito que o dev usa: *.localhost na porta 80.
on:
  push:
    branches: [main, dev, homologacao]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # os .env são gitignored; no CI só o mínimo pra API subir (seed usa os defaults do seed.go)
      - name: Cria os .env
        run: |
          cp gestao-de-epi--backEnd/.env-example gestao-de-epi--backEnd/.env
          sed -i '/^SUPER_ADMIN_/d' gestao-de-epi--backEnd/.env
          echo 'REACT_APP_API_URL=http://api.localhost/api' > SGEPI-FRONT-END/.env

      - name: Sobe o ambiente
        run: docker compose -f docker-compose.dev.yml up -d --build postgres mailpit traefik api front

      - name: Espera API e front
        run: |
          timeout 600 sh -c 'until curl -sf http://localhost/api >/dev/null; do sleep 5; done'
          timeout 600 sh -c 'until curl -sf http://localhost/ >/dev/null; do sleep 5; done'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Roda o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs dos containers
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs api front --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
